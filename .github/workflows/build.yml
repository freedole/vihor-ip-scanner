name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') {
            $v = $Matches[1]
          } else {
            $v = ([xml](Get-Content src/Vihor/Vihor.csproj)).Project.PropertyGroup[0].Version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Refresh MAC vendor database from IEEE (best effort)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force oui | Out-Null
          $ua = @{ 'User-Agent' = 'Mozilla/5.0 (vihor-ip-scanner build)' }
          Invoke-WebRequest https://standards-oui.ieee.org/oui/oui.csv     -Headers $ua -OutFile oui/oui.csv
          Invoke-WebRequest https://standards-oui.ieee.org/oui28/mam.csv   -Headers $ua -OutFile oui/mam.csv
          Invoke-WebRequest https://standards-oui.ieee.org/oui36/oui36.csv -Headers $ua -OutFile oui/oui36.csv
          python tools/build_oui.py src/Vihor/Resources/oui.txt.gz oui/oui.csv oui/mam.csv oui/oui36.csv

      - name: Build
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet build src/Vihor/Vihor.csproj -c Release `
            -p:Version=$v -p:FileVersion="$v.0" -p:AssemblyVersion="$v.0"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          } else {
            choco upgrade innosetup -y --no-progress
          }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" installer\vihor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Code signing via SignPath Foundation will be added here once the project is approved.

      - name: Portable zip + checksums
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $bin = "src/Vihor/bin/Release/net48"
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "$bin/VihorIPScanner.exe", "$bin/VihorIPScanner.exe.config" portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "dist/VihorIPScanner-Portable-$v.zip" -Force
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Build MSIX package (Microsoft Store)
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $id = Get-Content packaging/msix/identity.json -Raw | ConvertFrom-Json
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force $stage, store | Out-Null
          $bin = "src/Vihor/bin/Release/net48"
          Copy-Item "$bin/VihorIPScanner.exe", "$bin/VihorIPScanner.exe.config" $stage/
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item packaging/msix/Assets $stage/Assets -Recurse
          (Get-Content packaging/msix/AppxManifest.template.xml -Raw) `
            -replace '\$VERSION\$', $v `
            -replace '\$IDENTITY_NAME\$', $id.identityName `
            -replace '\$PUBLISHER\$', $id.publisher `
            -replace '\$PUBLISHER_DISPLAY\$', $id.publisherDisplayName |
            Set-Content "$stage/AppxManifest.xml" -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx.FullName pack /d $stage /p "store/VihorIPScanner-$v.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: VihorIPScanner-${{ steps.ver.outputs.version }}
          path: dist/*

      # Keep the latest Store package in a private draft release (drafts are visible only to maintainers)
      - name: Update private draft with Store package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete store-upload --repo "${{ github.repository }}" --yes *> $null
          $global:LASTEXITCODE = 0
          gh release create store-upload store/*.msix --repo "${{ github.repository }}" --draft `
            --title "Microsoft Store upload (private draft)" `
            --notes "Unsigned MSIX for Partner Center. Not for direct installation."

      # Unsigned MSIX for upload to Partner Center (the Store signs it); not attached to GitHub releases
      - uses: actions/upload-artifact@v4
        with:
          name: VihorIPScanner-Store-${{ steps.ver.outputs.version }}
          path: store/*.msix

      # A release is published when a v* tag is pushed, or when main contains a version
      # (src/Vihor/Vihor.csproj <Version>) that has no release yet. The tag is created automatically.
      - name: Check whether this version is already released
        id: rel
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT } else { "publish=true" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Publish GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vihor IP Scanner ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Download:** `VihorIPScanner-Setup-${{ steps.ver.outputs.version }}.exe` (installer) or `VihorIPScanner-Portable-${{ steps.ver.outputs.version }}.zip` (no installation).
            Verify files with `SHA256SUMS.txt`. Requirements: Windows 10/11 (.NET Framework 4.8).

      # Point the Scoop bucket (bucket/vihor.json) at the new release. Commits made with GITHUB_TOKEN
      # do not trigger another workflow run.
      - name: Update Scoop bucket
        if: steps.rel.outputs.publish == 'true'
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $zip = "dist/VihorIPScanner-Portable-$v.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $m = Get-Content bucket/vihor.json -Raw | ConvertFrom-Json
          $m.version = $v
          $m.url = "https://github.com/${{ github.repository }}/releases/download/v$v/VihorIPScanner-Portable-$v.zip"
          $m.hash = $hash
          $m | ConvertTo-Json -Depth 10 | Set-Content bucket/vihor.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/vihor.json
          git commit -m "Scoop: vihor $v" ; if ($LASTEXITCODE -eq 0) { git push origin HEAD:main }
          $global:LASTEXITCODE = 0
